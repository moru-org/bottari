# ==============================================================================
# Nginx Configuration for BOTTARI
# 배포 위치: Mac mini (192.168.0.5) /etc/nginx/sites-available/bottari.conf
# 연동 대상: M1 Max Workstation (192.168.0.8:3000)
# ==============================================================================

# WebSocket 및 Server-Sent Events(SSE) 연결 업그레이드 매핑
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 업스트림 정의 (M1 Max OrbStack Docker 인스턴스)
upstream bottari_backend {
    server 192.168.0.8:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server: HTTPS 리다이렉트 (또는 개발/테스트용 직접 프록시)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name bottari.yourdomain.com; # 👈 실제 사용하실 외부 도메인으로 변경하세요

    # Let's Encrypt Certbot 챌린지 경로
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS 리다이렉트 (도메인 SSL 적용 시 활성화)
    location / {
        return 301 https://$host$request_uri;
    }

    # [참고] SSL 적용 전 HTTP로만 임시 테스트할 경우 위 리다이렉트 대신 아래 블록 주석 해제:
    # location / {
    #     proxy_pass http://bottari_backend;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server: 프로덕션 리버스 프록시
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bottari.yourdomain.com; # 👈 실제 사용하실 외부 도메인으로 변경하세요

    # SSL 인증서 경로 (Let's Encrypt 등)
    # ssl_certificate /etc/letsencrypt/live/bottari.yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bottari.yourdomain.com/privkey.pem;

    # SSL 보안 파라미터
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 클라이언트 요청 제한
    client_max_body_size 20M;

    # Next.js 정적 애셋 캐싱 최적화 (_next/static)
    location /_next/static/ {
        proxy_pass http://bottari_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 기본 애플리케이션 및 API 프록시
    location / {
        proxy_pass http://bottari_backend;
        proxy_http_version 1.1;

        # 프록시 헤더 설정 (Zero-trust 및 클라이언트 IP 추적)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket & HMR & SSE 지원
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 버퍼 및 타임아웃 최적화
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
